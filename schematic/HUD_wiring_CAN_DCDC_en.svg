<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 850" width="940" height="850" font-family="Arial, Helvetica, sans-serif">
  <title>Wiring diagram: DC-DC, Adafruit CAN Pal (5708) and Waveshare ESP32-S3-Touch-LCD-3.49</title>
  <rect width="940" height="850" fill="#ffffff"/>
  <defs>
    <style>
      .box{fill:#f4f6f8;stroke:#334155;stroke-width:2;rx:10}
      .t{font-size:15px;fill:#0f172a}
      .h{font-size:17px;font-weight:bold;fill:#0f172a}
      .s{font-size:12.5px;fill:#475569}
      .w{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
      .pin{fill:#ffffff;stroke:#334155;stroke-width:2}
      .nc{font-size:12.5px;fill:#b91c1c;font-weight:bold}
    </style>
  </defs>

  <text x="20" y="32" class="h" font-size="20">HUD wiring: ACC power and own CAN transceiver</text>

  <!-- ===== Car ===== -->
  <rect x="20" y="52" width="190" height="458" rx="10" class="box"/>
  <text x="115" y="76" class="h" text-anchor="middle">Car</text>
  <text x="32" y="105" class="t">+12 V ACC</text>
  <text x="32" y="123" class="s">(ignition-switched)</text>
  <text x="32" y="165" class="t" dy="5">Chassis ground</text>
  <text x="32" y="300" class="t" dy="5">I-CAN H</text>
  <text x="32" y="340" class="t" dy="5">I-CAN L</text>
  <text x="32" y="380" class="t" dy="5">Ground</text>
  <text x="32" y="415" class="s">I-CAN — twisted pair</text>
  <text x="32" y="431" class="s">to the CAN Pal terminal</text>
  <circle cx="210" cy="110" r="5" class="pin"/><circle cx="210" cy="165" r="5" class="pin"/>
  <circle cx="210" cy="300" r="5" class="pin"/><circle cx="210" cy="340" r="5" class="pin"/><circle cx="210" cy="380" r="5" class="pin"/>

  <!-- fuse -->
  <path class="w" stroke="#dc2626" d="M215 110 H228"/>
  <rect x="228" y="100" width="38" height="20" rx="3" fill="#fff" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M233 110 H261" stroke="#dc2626" stroke-width="2"/>
  <path class="w" stroke="#dc2626" d="M266 110 H300"/>
  <text x="247" y="93" class="s" text-anchor="middle">1–2 A</text>

  <!-- ===== DC-DC ===== -->
  <rect x="300" y="70" width="190" height="130" rx="10" class="box"/>
  <text x="395" y="90" class="h" text-anchor="middle">DC-DC</text>
  <text x="395" y="138" class="s" text-anchor="middle">step-down</text>
  <text x="395" y="156" class="s" text-anchor="middle">12 V → 5 V</text>
  <text x="310" y="110" class="t" dy="4">IN+</text><text x="310" y="165" class="t" dy="4">IN−</text>
  <text x="482" y="110" class="t" dy="4" text-anchor="end">OUT+</text><text x="482" y="165" class="t" dy="4" text-anchor="end">OUT−</text>
  <circle cx="300" cy="110" r="5" class="pin"/><circle cx="300" cy="165" r="5" class="pin"/>
  <circle cx="490" cy="110" r="5" class="pin"/><circle cx="490" cy="165" r="5" class="pin"/>

  <path class="w" stroke="#111827" d="M215 165 H300"/>

  <!-- ===== Waveshare ===== -->
  <rect x="650" y="70" width="270" height="590" rx="10" class="box"/>
  <text x="785" y="96" class="h" text-anchor="middle">Waveshare</text>
  <text x="785" y="114" class="s" text-anchor="middle">ESP32-S3-Touch-LCD-3.49</text>
  <text x="662" y="110" class="t" dy="4">5 V IN</text>
  <text x="662" y="165" class="t" dy="4">GND</text>
  <text x="662" y="290" class="t" dy="4">3V3</text>
  <text x="662" y="440" class="t" dy="4">GPIO1 (RX)</text>
  <text x="662" y="480" class="t" dy="4">GPIO2 (unused)</text>
  <text x="785" y="190" class="s" text-anchor="middle">5 V — to USB-C or the board's 5 V pin</text>
  <circle cx="650" cy="110" r="5" class="pin"/><circle cx="650" cy="165" r="5" class="pin"/>
  <circle cx="650" cy="290" r="5" class="pin"/><circle cx="650" cy="440" r="5" class="pin"/><circle cx="650" cy="480" r="5" class="pin"/>

  <path class="w" stroke="#f97316" d="M495 110 H645"/>
  <path class="w" stroke="#111827" d="M495 165 H645"/>

  <!-- ===== CAN Pal ===== -->
  <rect x="300" y="250" width="200" height="260" rx="10" class="box"/>
  <text x="400" y="274" class="h" text-anchor="middle">Adafruit CAN Pal</text>
  <text x="400" y="291" class="s" text-anchor="middle">5708, TJA1051T/3</text>
  <text x="310" y="300" class="t" dy="4">H</text>
  <text x="310" y="340" class="t" dy="4">L</text>
  <text x="310" y="380" class="t" dy="4">GND (middle)</text>
  <text x="492" y="320" class="t" dy="4" text-anchor="end">Vcc</text>
  <text x="492" y="360" class="t" dy="4" text-anchor="end">SLNT</text>
  <text x="492" y="400" class="t" dy="4" text-anchor="end">GND</text>
  <text x="492" y="440" class="t" dy="4" text-anchor="end">RX</text>
  <text x="492" y="480" class="t" dy="4" text-anchor="end">TX</text>
  <text x="310" y="428" class="s">Termination:</text>
  <rect x="310" y="436" width="58" height="22" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="339" y="452" class="nc" text-anchor="middle">OFF</text>
  <circle cx="300" cy="300" r="5" class="pin"/><circle cx="300" cy="340" r="5" class="pin"/><circle cx="300" cy="380" r="5" class="pin"/>
  <circle cx="500" cy="320" r="5" class="pin"/><circle cx="500" cy="360" r="5" class="pin"/><circle cx="500" cy="400" r="5" class="pin"/>
  <circle cx="500" cy="440" r="5" class="pin"/><circle cx="500" cy="480" r="5" class="pin"/>

  <!-- CAN -->
  <path class="w" stroke="#eab308" d="M215 300 H295"/>
  <path class="w" stroke="#16a34a" d="M215 340 H295"/>
  <path class="w" stroke="#111827" d="M215 380 H295"/>

  <!-- 3V3 -->
  <path class="w" stroke="#9333ea" d="M505 320 H580 V290 H645"/>
  <path class="w" stroke="#9333ea" d="M505 360 H580 V320"/>
  <circle cx="580" cy="320" r="4.5" fill="#9333ea"/>
  <path class="w" stroke="#9333ea" d="M625 290 V612 H505"/>
  <circle cx="625" cy="290" r="4.5" fill="#9333ea"/>

  <!-- GND CAN Pal -> board GND -->
  <path class="w" stroke="#111827" d="M505 400 H610 V165 M610 400 V590 H505"/>
  <circle cx="610" cy="165" r="4.5" fill="#111827"/>

  <!-- RX -->
  <path class="w" stroke="#2563eb" d="M505 440 H645"/>

  <!-- TX: do not connect -->
  <path class="w" stroke="#b91c1c" stroke-dasharray="6 6" d="M505 480 H560"/>
  <path stroke="#b91c1c" stroke-width="3.5" stroke-linecap="round" d="M565 472 L581 488 M581 472 L565 488"/>
  <text x="515" y="466" class="nc">do not connect</text>


  <!-- ===== Light sensor (optional) ===== -->
  <rect x="300" y="535" width="200" height="120" rx="10" class="box"/>
  <text x="400" y="557" class="h" text-anchor="middle" font-size="15">Light sensor (optional)</text>
  <text x="400" y="573" class="s" text-anchor="middle">LDR + 10 kΩ + 100 nF</text>
  <text x="492" y="590" class="t" dy="4" text-anchor="end">GND</text>
  <text x="492" y="612" class="t" dy="4" text-anchor="end">3V3</text>
  <text x="492" y="634" class="t" dy="4" text-anchor="end">OUT</text>
  <circle cx="500" cy="590" r="5" class="pin"/><circle cx="500" cy="612" r="5" class="pin"/><circle cx="500" cy="634" r="5" class="pin"/>
  <path class="w" stroke="#0891b2" d="M505 634 H645"/>
  <text x="662" y="634" class="t" dy="4">GPIO5 (light sensor)</text>
  <circle cx="650" cy="634" r="5" class="pin"/>

  <g transform="translate(0,150)">
  <!-- ===== Notes ===== -->
  <line x1="20" y1="540" x2="920" y2="540" stroke="#cbd5e1"/>
  <text x="20" y="566" class="t"><tspan font-weight="bold">Wire colours:</tspan>
    <tspan fill="#dc2626">■</tspan> +12 V   <tspan fill="#f97316">■</tspan> +5 V   <tspan fill="#111827">■</tspan> ground   <tspan fill="#9333ea">■</tspan> 3.3 V   <tspan fill="#eab308">■</tspan> CAN-H   <tspan fill="#16a34a">■</tspan> CAN-L   <tspan fill="#2563eb">■</tspan> RX data   <tspan fill="#0891b2">■</tspan> light sensor signal</text>
  <text x="20" y="592" class="s">• Receive only on RX (GPIO1): transmitting to the bus is ruled out — TX is not connected, SLNT is tied to 3V3 (silent), driver in LISTEN_ONLY.</text>
  <text x="20" y="612" class="s">• CAN Pal Termination switch is OFF: the car bus is already terminated.  • All grounds (DC-DC, CAN Pal, board, bus) are common.</text>
  <text x="20" y="632" class="s">• Take +12 V from an ignition-switched (ACC) line through a 1–2 A fuse; use an automotive DC-DC with current margin and surge protection.</text>
  <text x="20" y="652" class="s">• CAN Pal Vcc goes to the board's 3V3: the CAN Pal has its own 5 V charge pump for the transceiver and handles level matching.</text>
  <text x="20" y="672" class="s">• The photoresistor is optional: it is used when there is no RLS_01 data on CAN.</text>
  <text x="20" y="688" class="s">  Enable and calibrate it in the menu (More → Sensor): cover the sensor → Dark, shine a torch → Bright.</text>
  </g>
</svg>
