<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="Arial, Helvetica, sans-serif">
  <title>Photoresistor divider: light sensor on GPIO5</title>
  <rect width="860" height="470" fill="#ffffff"/>
  <defs><style>
    .t{font-size:15px;fill:#0f172a} .h{font-size:20px;font-weight:bold;fill:#0f172a} .s{font-size:12.5px;fill:#475569}
    .w{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
    .p{fill:#ffffff;stroke:#334155;stroke-width:2}
    .part{fill:#f4f6f8;stroke:#334155;stroke-width:2.5}
  </style></defs>
  <text x="20" y="32" class="h">Photoresistor divider: light sensor on GPIO5</text>

  <!-- 3V3 rail -->
  <text x="40" y="82" class="t" font-weight="bold">3V3</text>
  <path class="w" stroke="#9333ea" d="M40 95 H400"/>
  <circle cx="200" cy="95" r="4.5" fill="#9333ea"/>
  <circle cx="400" cy="95" r="4.5" fill="#9333ea"/>

  <!-- LDR -->
  <path class="w" stroke="#9333ea" d="M200 95 V120"/>
  <rect x="180" y="120" width="40" height="80" rx="4" class="part"/>
  <path d="M168 150 l-18 -18 m0 0 l8 0 m-8 0 l0 8 M168 172 l-18 -18 m0 0 l8 0 m-8 0 l0 8" stroke="#eab308" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="125" y="212" class="t" text-anchor="end">Photoresistor</text>
  <text x="125" y="230" class="s" text-anchor="end">(LDR)</text>
  <path class="w" stroke="#0891b2" d="M200 200 V250"/>

  <!-- node -->
  <circle cx="200" cy="250" r="5" fill="#0891b2"/>
  <path class="w" stroke="#0891b2" d="M200 250 H540"/>
  <circle cx="545" cy="250" r="5" class="p"/>
  <text x="560" y="246" class="t">GPIO5 (ADC1)</text>
  <text x="560" y="264" class="s">to Waveshare</text>

  <!-- 10k -->
  <path class="w" stroke="#0891b2" d="M200 250 V270"/>
  <rect x="180" y="270" width="40" height="80" rx="4" class="part"/>
  <text x="125" y="315" class="t" text-anchor="end">10 kΩ</text>
  <path class="w" stroke="#111827" d="M200 350 V400"/>

  <!-- 100n -->
  <circle cx="400" cy="250" r="4.5" fill="#0891b2"/>
  <path class="w" stroke="#0891b2" d="M400 250 V300"/>
  <path d="M378 300 H422 M378 316 H422" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <path class="w" stroke="#111827" d="M400 316 V400"/>
  <text x="440" y="312" class="t">100 nF</text>

  <!-- GND rail -->
  <path class="w" stroke="#111827" d="M40 400 H400"/>
  <circle cx="200" cy="400" r="4.5" fill="#111827"/>
  <circle cx="400" cy="400" r="4.5" fill="#111827"/>
  <text x="40" y="392" class="t" font-weight="bold">GND</text>

  <text x="20" y="430" class="s">• Brighter light - lower LDR resistance - higher voltage on GPIO5 (reversed mounting just inverts it; the calibration handles that).</text>
  <text x="20" y="446" class="s">• The 100 nF capacitor goes from GPIO5 to GND, as close to the board as possible: it filters noise. 10 kΩ suits an LDR of about 5-20 kΩ in light.</text>
  <text x="20" y="462" class="s">• The input must not exceed 3.3 V - power the divider from the board's 3V3 only.</text>
</svg>
